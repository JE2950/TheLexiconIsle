<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lexicon Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{
  --grey:#c9c9c9; --grey-hi:#f2f2f2; --grey-lo:#7d7d7d; --grey-dk:#3d3d3d;
  --title:#1d3f8f; --title-hi:#4f78d6;
  --parch:#f3e6c4; --parch-lo:#c9b27a; --ink:#2a1e12; --ink-soft:#6b5a43;
  --brass:#b98a32; --brass-hi:#f0cf7a; --brass-lo:#6e4e14;
  --ok:#2f8a4e; --no:#b23a2e; --gold:#ffcc33; --sea:#0c1a2a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sea);overflow:hidden}
body{font-family:"Lexend",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(ellipse at 50% 30%,#1c3550,#0c1a2a 70%)}
button{font:inherit;cursor:pointer;color:inherit}
#fit{position:fixed;inset:0;display:grid;place-items:center}
#win{position:relative;width:1024px;height:960px;transform-origin:center center;
  background:var(--grey);box-shadow:inset 3px 3px 0 var(--grey-hi),inset -3px -3px 0 var(--grey-lo),0 20px 60px #000a}

/* title bar: a nod to 1990s desktop windows */
#bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 6px;background:linear-gradient(#e2e2e2,#bdbdbd);border-bottom:3px solid var(--grey-dk)}
#bar .tt{flex:1;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;
  background:var(--title);box-shadow:inset 2px 2px 0 var(--title-hi),inset -2px -2px 0 #0b1f4d;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.tb{height:28px;min-width:28px;padding:0 10px;border:0;background:var(--grey);font-size:14px;font-weight:600;
  box-shadow:inset 2px 2px 0 var(--grey-hi),inset -2px -2px 0 var(--grey-lo)}
.tb:active{box-shadow:inset -2px -2px 0 var(--grey-hi),inset 2px 2px 0 var(--grey-lo)}
.tb[aria-pressed="false"]{color:#888}

/* scene */
#scene{position:relative;width:1024px;height:768px;overflow:hidden;background:#000}
#scene > img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto;transition:opacity .35s}
#scene.fade > img.bg{opacity:0}
.layer{position:absolute;inset:0}
/* small squares to click, as in the old adventures */
.hot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid #fff;background:#ffcc3366;cursor:pointer;
  box-shadow:0 0 0 2px #000a;animation:blink 1.4s steps(2,end) infinite}
.hot.seen{animation:none;background:#ffffff33;border-color:#ffffffcc}
.hot:hover,.hot:focus-visible{background:var(--gold);outline:none;animation:none}
@keyframes blink{50%{border-color:var(--gold);background:#fff4}}
.tip{position:absolute;transform:translate(-50%,-150%);background:var(--parch);border:2px solid var(--ink);padding:2px 8px;font-size:15px;font-weight:600;white-space:nowrap;pointer-events:none;display:none;z-index:5}
.hot:hover + .tip,.hot:focus-visible + .tip,.arrow:hover + .tip,.arrow:focus-visible + .tip{display:block}
/* go-on arrows */
.arrow{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 3px 0 #000a)}
.arrow svg{width:100%;height:100%}
.arrow:hover svg path,.arrow:focus-visible svg path{fill:var(--gold)}
.arrow.locked{opacity:.45}
/* things drawn onto the scene */
.mark{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.dial{font-weight:700;font-size:26px;color:var(--brass-hi);text-shadow:0 0 8px #ffb000,0 2px 0 #000;animation:pop .5s}
.cog{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#ffe9a8,#c38b1e 60%,#6e4e14);box-shadow:0 0 12px #ffcc33;animation:pop .5s}
.gem{width:34px;height:34px;border-radius:50%;box-shadow:0 0 18px 6px currentColor,inset -4px -4px 0 #0005,inset 4px 4px 0 #fff6;animation:pop .6s}
.carve{font-weight:700;font-size:20px;color:#f6e3b4;text-shadow:0 2px 0 #2a1a08,0 0 6px #000;transform:translate(-50%,-50%) rotate(-4deg);animation:pop .5s}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}}

/* bottom panel: narration and pocket */
#bottom{display:flex;gap:8px;height:154px;padding:8px;border-top:3px solid var(--grey-dk)}
#say{flex:1;position:relative;background:var(--parch);box-shadow:inset 3px 3px 0 var(--parch-lo),inset -3px -3px 0 #fff8;padding:12px 16px 12px 16px;display:flex;gap:12px}
#sayText{flex:1;font-size:19px;line-height:1.42;overflow:auto}
#sayText .who{font-weight:700;color:#7a3b10}
#sayBtns{display:flex;flex-direction:column;gap:8px;justify-content:space-between;align-items:flex-end}
.goon{border:0;padding:8px 14px;font-weight:700;font-size:17px;background:var(--gold);box-shadow:inset 2px 2px 0 #fff6,inset -3px -3px 0 #a87a00;display:flex;gap:6px;align-items:center}
.goon:disabled{visibility:hidden}
.replay{border:0;background:none;font-size:22px;padding:0 4px}
#pocket{width:300px;background:#5b4630;box-shadow:inset 3px 3px 0 #8b6e4c,inset -3px -3px 0 #2e2216;padding:8px;display:grid;grid-template-rows:auto 1fr auto;gap:4px}
#pocket h4{margin:0;font-size:13px;color:#f3e6c4;letter-spacing:.08em;text-transform:uppercase}
#items{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.item{height:46px;background:#3e2f20;box-shadow:inset 2px 2px 0 #241a10;display:grid;place-items:center;font-size:26px;position:relative}
.item[title]:hover::after{content:attr(title);position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--parch);color:var(--ink);font-size:13px;padding:2px 6px;white-space:nowrap;border:2px solid var(--ink);z-index:9}
#stones{display:flex;gap:6px;justify-content:center}
.st{width:24px;height:24px;border-radius:50%;background:#2e2216;box-shadow:inset 2px 2px 0 #0007}
.st.on{box-shadow:0 0 8px 2px currentColor,inset -3px -3px 0 #0005,inset 3px 3px 0 #fff7}

/* machine panels: each puzzle is a contraption with chunky controls */
#machine{position:absolute;left:52px;top:30px;width:920px;height:708px;display:none;flex-direction:column;
  background:linear-gradient(#5a4530,#3b2c1d);padding:14px;box-shadow:0 0 0 4px #1d140b,inset 4px 4px 0 #8b6e4c,inset -4px -4px 0 #1d140b,0 20px 60px #000c;z-index:20}
#machine.open{display:flex}
.rivet{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a8,#8a6420)}
#mHead{display:flex;align-items:center;gap:14px;color:#f3e6c4;margin-bottom:10px}
#mHead h2{margin:0;font-size:24px;flex:1}
#slots{display:flex;gap:8px}
.slot{width:36px;height:36px;display:grid;place-items:center;font-weight:700;font-size:18px;background:#1d140b;color:#6e5a3e;box-shadow:inset 3px 3px 0 #000a;border-radius:6px}
.slot.full{background:var(--brass);color:#2a1e12;box-shadow:inset 2px 2px 0 var(--brass-hi),inset -3px -3px 0 var(--brass-lo)}
.slot.life{border-radius:50%;font-size:20px}
#mScreen{flex:1;overflow:auto;background:var(--parch);box-shadow:inset 4px 4px 0 var(--parch-lo);padding:18px 22px;font-size:19px;line-height:1.45}
#mScreen .prompt{margin-bottom:14px}
#mCtrl{display:flex;gap:10px;margin-top:12px;align-items:center}
#mCtrl .sp{flex:1}
.mbtn{border:0;padding:10px 18px;font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:#2a1e12;
  background:var(--brass);box-shadow:inset 3px 3px 0 var(--brass-hi),inset -3px -3px 0 var(--brass-lo),0 4px 0 #000}
.mbtn:active{transform:translateY(3px);box-shadow:inset 3px 3px 0 var(--brass-hi),inset -3px -3px 0 var(--brass-lo),0 1px 0 #000}
.mbtn.grey{background:#9c9184;box-shadow:inset 3px 3px 0 #d6cdbf,inset -3px -3px 0 #5d554a,0 4px 0 #000}
.mbtn:disabled{opacity:.4;cursor:default}
#mFeed{margin-top:12px}
.fb{padding:10px 14px;border:3px solid var(--ink)}
.fb.good{background:#d4efd9}.fb.bad{background:#f6d5cf}.fb.how{background:#fff;border-color:#2f6b8a}
.fb b.v{display:block;font-size:20px}

/* the question engine's own pieces (shared with Station Zero) */
.prompt b.target{font-size:1.2em;background:#fff;padding:0 6px;box-shadow:0 3px 0 var(--brass)}
.prompt .blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--ink);text-align:center;color:var(--brass-lo)}
.prompt .sentence,.vr-show{display:block;margin-top:8px;padding:10px 12px;background:#fff;font-size:1.05em;box-shadow:inset 2px 2px 0 var(--parch-lo)}
.vr-show{text-align:center;font-weight:600;letter-spacing:.02em}
.vr-abc{display:flex;flex-wrap:wrap;gap:2px;margin-top:10px;justify-content:center}
.vr-abc i{font-style:normal;display:grid;text-align:center;width:26px;background:#fff;box-shadow:inset 0 -2px 0 var(--parch-lo);line-height:1.1;padding:2px 0}
.vr-abc b{font-size:15px}.vr-abc small{font-size:10px;color:var(--ink-soft)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;border:0;padding:8px 12px 8px 8px;min-height:50px;background:#fff;font-size:18px;box-shadow:inset -3px -3px 0 var(--parch-lo),0 2px 0 #0002}
.opt:hover:not(:disabled){background:#fff8e3}
.opt .key{width:34px;height:34px;display:grid;place-items:center;font-weight:700;background:var(--brass);box-shadow:inset 2px 2px 0 var(--brass-hi),inset -2px -2px 0 var(--brass-lo)}
.opt:disabled,.chip:disabled{cursor:default}
.opt.ok,.chip.ok{background:#c9f0d4;box-shadow:inset -3px -3px 0 var(--ok)}
.opt.ok .key{background:var(--ok);color:#fff}
.opt.no,.chip.no{background:#f6cfca;box-shadow:inset -3px -3px 0 var(--no)}
.opt.no .key{background:var(--no);color:#fff}
.opt.faded,.chip.faded{opacity:.5}
.vr-groups{display:grid;gap:10px}
.vr-group{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.vr-gl{flex-basis:100%;text-align:center;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.vr-br{font-size:2rem;color:var(--ink-soft);line-height:1}
.vr-pick-note{text-align:center;font-size:14px;color:var(--ink-soft);margin-top:4px}
.chip{border:0;min-height:46px;padding:8px 14px;background:#fff;font-size:18px;box-shadow:inset -3px -3px 0 var(--parch-lo),0 2px 0 #0002}
.chip.sel{background:#2f6b8a;color:#fff}

/* dialogs: title, set up, map, certificate */
.dlg{position:absolute;inset:0;display:none;place-items:center;z-index:40;background:#0008}
.dlg.open{display:grid}
.panel{width:720px;max-height:700px;overflow:auto;background:var(--grey);box-shadow:inset 3px 3px 0 var(--grey-hi),inset -3px -3px 0 var(--grey-lo),0 0 0 3px var(--grey-dk);padding:0 0 18px}
.panel .ph{background:var(--title);color:#fff;font-weight:700;padding:6px 12px;margin-bottom:14px;box-shadow:inset 2px 2px 0 var(--title-hi)}
.panel .pb{padding:0 20px}
.panel h3{margin:14px 0 6px;font-size:17px}
.panel p{margin:6px 0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios button{border:0;padding:8px 12px;background:var(--grey);box-shadow:inset 2px 2px 0 var(--grey-hi),inset -2px -2px 0 var(--grey-lo);text-align:left}
.radios button[aria-pressed="true"]{background:#fff;box-shadow:inset 2px 2px 0 var(--grey-lo),inset -2px -2px 0 var(--grey-hi);outline:3px solid var(--title)}
.radios small{display:block;font-size:12px;color:#555}
input.name{font:inherit;font-size:22px;padding:8px 12px;width:100%;border:0;box-shadow:inset 3px 3px 0 var(--grey-lo),inset -2px -2px 0 var(--grey-hi)}
#titleArt{position:absolute;inset:0;background:url(img/title.jpg) center/cover;z-index:39;display:none}
#titleArt.open{display:block}
#titleArt h1{position:absolute;top:34px;width:100%;text-align:center;margin:0;font-size:84px;color:var(--gold);
  text-shadow:0 5px 0 #6b3d00,0 0 30px #000,4px 4px 0 #000;letter-spacing:.03em}
#titleArt .sub{position:absolute;top:140px;width:100%;text-align:center;font-size:24px;color:#fff;text-shadow:0 2px 6px #000}
#titleBox{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:600px}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapgrid button{border:0;padding:10px;text-align:left;background:var(--parch);box-shadow:inset 2px 2px 0 #fff8,inset -3px -3px 0 var(--parch-lo);font-weight:600}
.mapgrid button:disabled{opacity:.4}
.mapgrid small{display:block;font-weight:400;font-size:13px}
.cert{width:760px;background:#fffaf0;border:10px double var(--brass);padding:26px 34px;text-align:center}
.cert h2{font-size:40px;margin:6px 0;color:var(--brass-lo)}
.cert .nm{font-size:48px;font-weight:700;margin:6px 0}
</style>
</head>
<body>
<div id="fit"><div id="win">
  <div id="bar">
    <button class="tb" id="btnMap" title="Map (M)">Map</button>
    <div class="tt" id="tt">The Lexicon Isle</div>
    <button class="tb" id="btnVoice" title="Narrator on or off" aria-pressed="true">Voice</button>
    <button class="tb" id="btnMusic" title="Music on or off" aria-pressed="true">Music</button>
    <button class="tb" id="btnSetup" title="Set Up">Set Up</button>
  </div>
  <div id="scene">
    <img class="bg" id="bg" alt="">
    <div class="layer" id="marks"></div>
    <div class="layer" id="hots"></div>
    <div id="machine">
      <i class="rivet" style="left:6px;top:6px"></i><i class="rivet" style="right:6px;top:6px"></i><i class="rivet" style="left:6px;bottom:6px"></i><i class="rivet" style="right:6px;bottom:6px"></i>
      <div id="mHead"><h2 id="mTitle"></h2><div id="slots"></div></div>
      <div id="mScreen"><div class="prompt" id="mPrompt"></div><div id="ans"></div><div id="mFeed"></div></div>
      <div id="mCtrl"><button class="mbtn grey" id="mHow">How?</button><button class="mbtn grey" id="mLeave">Leave</button><span class="sp"></span><button class="mbtn" id="mNext" disabled>Next ▶</button></div>
    </div>
    <div id="titleArt"><h1>The Lexicon Isle</h1><div class="sub">A verbal reasoning adventure</div><div id="titleBox"></div></div>
    <div class="dlg" id="dlg"><div id="dlgIn"></div></div>
  </div>
  <div id="bottom">
    <div id="say"><div id="sayText"></div><div id="sayBtns"><button class="replay" id="replay" title="Hear it again">🔊</button><button class="goon" id="goon" disabled>Go on ▶</button></div></div>
    <div id="pocket"><h4>Your pockets</h4><div id="items"></div><div id="stones"></div></div>
  </div>
</div></div>
<audio id="music" src="music/theme.mp3" loop preload="none"></audio>
<script src="bank.js"></script>
<script src="atom.js"></script>
<script src="gl_style.js"></script>
<script src="vr.js"></script>
<script src="game.js"></script>
</body>
</html>
